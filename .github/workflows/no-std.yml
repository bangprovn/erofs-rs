name: no_std

on:
  push:
  pull_request:

jobs:
  no-std:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.89.0
          components: clippy

      - run: cargo build -p erofs-rs --no-default-features --locked
      - run: cargo clippy -p erofs-rs --no-default-features --all-targets --locked -- -D warnings
      # Doctests use the std-only MmapImage backend, so only lib + integration tests run here.
      - run: cargo test -p erofs-rs --no-default-features --lib --tests --locked
